name: Build Madrasati Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - madrasati-flutter-v1.0.0.zip
      - .github/workflows/build-madrasati-android.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FLUTTER_VERSION: '3.50.0'
      NDK_VERSION: '28.2.13676358'
      LIBRARY_OWNER: ${{ vars.LIBRARY_OWNER }}
      LIBRARY_REPO: ${{ vars.LIBRARY_REPO }}
      LIBRARY_BRANCH: ${{ vars.LIBRARY_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/madrasati-flutter"
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"
          python3 - "$GITHUB_WORKSPACE/madrasati-flutter-v1.0.0.zip" "$PROJECT_DIR" <<'PY'
          """Extract and validate the release source archive on the Actions runner."""
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import re
          import stat
          import sys

          VERSION = '1.0.0+1'
          ARCHIVE = 'madrasati-flutter-v1.0.0.zip'
          REQUIRED = {'pubspec.yaml', 'lib/main.dart', 'android/app/build.gradle',
                      'android/gradle/wrapper/gradle-wrapper.jar',
                      'android/app/src/main/AndroidManifest.xml', 'ci/check_source.py',
                      'modules/jadwali/pubspec.yaml', 'modules/sajli/pubspec.yaml',
                      'modules/bell/pubspec.yaml', 'modules/scanner/pubspec.yaml',
                      'modules/library/pubspec.yaml'}


          def extract(archive: Path, target: Path) -> None:
              if archive.name != ARCHIVE or not archive.is_file():
                  raise SystemExit(f'Upload {ARCHIVE} to the repository root without extracting it.')
              if target.exists():
                  raise SystemExit('The build directory must be new.')
              with ZipFile(archive) as source:
                  names = source.namelist()
                  if len(set(names)) != len(names) or not REQUIRED.issubset(names):
                      raise SystemExit('The ZIP is missing required project files or has duplicate paths.')
                  if len(names) > 6000 or sum(entry.file_size for entry in source.infolist()) > 150_000_000:
                      raise SystemExit('Unexpected size for the source archive.')
                  for entry in source.infolist():
                      name = PurePosixPath(entry.filename)
                      if name.is_absolute() or '..' in name.parts or chr(92) in entry.filename or stat.S_ISLNK(entry.external_attr >> 16):
                          raise SystemExit('Unsafe path in the source archive.')
                  if source.testzip() is not None:
                      raise SystemExit('The ZIP contents are damaged.')
                  spec = source.read('pubspec.yaml').decode()
                  if not re.search(r'^version:\s*' + re.escape(VERSION) + r'\s*$', spec, re.M):
                      raise SystemExit(f'The project in the ZIP must have version {VERSION}.')
                  source.extractall(target)


          if __name__ == '__main__':
              extract(Path(sys.argv[1]), Path(sys.argv[2]))
          PY
          cd "$PROJECT_DIR"
          python3 ci/check_source.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install and verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory is missing after Android setup."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager is missing from PATH and $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$SDK_ROOT" "$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          test -s "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "$NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Resolve the unified dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get
          flutter pub deps --style=compact

      - name: Analyze unified Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos lib test
          flutter analyze --no-pub --no-fatal-infos modules/jadwali/lib modules/bell/lib modules/sajli/lib modules/scanner/lib modules/library/lib

      - name: Test shared school workflows
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --no-pub

      - name: Test original scheduling, reports, scanner and notification logic
        shell: bash
        run: |
          set -euo pipefail
          for module in jadwali sajli scanner library bell; do
            (
              cd "$PROJECT_DIR/modules/$module"
              if [[ -d test ]]; then flutter test; fi
            )
          done

      - name: Build unified release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -n "$LIBRARY_OWNER" && -z "$LIBRARY_REPO" ]] || [[ -z "$LIBRARY_OWNER" && -n "$LIBRARY_REPO" ]]; then
            echo 'Set both LIBRARY_OWNER and LIBRARY_REPO, or leave both empty to use the bundled catalog.'
            exit 1
          fi
          flutter build apk --release --no-pub \
            --dart-define="LIBRARY_OWNER=$LIBRARY_OWNER" \
            --dart-define="LIBRARY_REPO=$LIBRARY_REPO" \
            --dart-define="LIBRARY_BRANCH=$LIBRARY_BRANCH"
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -tq build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/madrasati-apk-info.txt"
          grep -F "package: name='iq.madrasati.school' versionCode='1' versionName='1.0.0'" "$RUNNER_TEMP/madrasati-apk-info.txt"

      - name: Run Android bell regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Prepare verified downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deliverables"
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" "$RUNNER_TEMP/deliverables/Madrasati-v1.0.0.apk"
          cp "$GITHUB_WORKSPACE/madrasati-flutter-v1.0.0.zip" "$RUNNER_TEMP/deliverables/"
          cp "$RUNNER_TEMP/madrasati-apk-info.txt" "$RUNNER_TEMP/deliverables/"
          cp "$PROJECT_DIR/pubspec.lock" "$RUNNER_TEMP/deliverables/resolved-pubspec.lock"

      - uses: actions/upload-artifact@v4
        with:
          name: madrasati-v1.0.0-android
          path: ${{ runner.temp }}/deliverables/
          if-no-files-found: error
