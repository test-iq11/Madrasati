name: Build Madrasati Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - .github/workflows/build-madrasati-android.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_PROJECT_VERSION: '1.4.5+30'
      FLUTTER_VERSION: '3.50.0'
      NDK_VERSION: '28.2.13676358'
      LIBRARY_OWNER: ${{ vars.LIBRARY_OWNER || github.repository_owner }}
      LIBRARY_REPO: ${{ vars.LIBRARY_REPO || 'iraqi-curriculum-library-rebuild' }}
      LIBRARY_BRANCH: ${{ vars.LIBRARY_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate, verify and extract the uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/madrasati-flutter"
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"
          echo 'Files in repository root:'
          ls -lah "$GITHUB_WORKSPACE"
          python3 - "$GITHUB_WORKSPACE" "$PROJECT_DIR" "$GITHUB_ENV" <<'PY'
          """Select one valid root-level ZIP without requiring an exact filename."""
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import os
          import re
          import stat
          import sys

          workspace = Path(sys.argv[1])
          target = Path(sys.argv[2])
          env_file = Path(sys.argv[3])
          required = {
              'pubspec.yaml', 'lib/main.dart', 'android/app/build.gradle',
              'android/gradle/wrapper/gradle-wrapper.jar',
              'android/app/src/main/AndroidManifest.xml', 'ci/check_source.py',
              'modules/jadwali/pubspec.yaml', 'modules/sajli/pubspec.yaml',
              'modules/bell/pubspec.yaml', 'modules/scanner/pubspec.yaml',
              'modules/card_settings/lib/card_size.dart', 'modules/scanner/lib/four_cards.dart',
              'modules/library/pubspec.yaml',
          }
          archives = sorted(p for p in workspace.iterdir()
                            if p.is_file() and p.suffix.lower() == '.zip')
          if not archives:
              raise SystemExit(
                  'ERROR: No ZIP file in repository ROOT. On GitHub open the '
                  'repository > Add file > Upload files, choose '
                  'madrasati-flutter-v1.4.5.zip, then Commit changes. '
                  'Do not unzip it or put it inside a folder.')
          print('ZIP files found:', ', '.join(p.name for p in archives))
          expected_version = os.environ['EXPECTED_PROJECT_VERSION']
          expected_archive = f'madrasati-flutter-v{expected_version.split("+", 1)[0]}.zip'
          valid = []
          for path in archives:
              try:
                  with ZipFile(path) as source:
                      names = set(source.namelist())
                      if not required.issubset(names):
                          print('Skipping', path.name, '- not the complete Madrasati source')
                          continue
                      spec = source.read('pubspec.yaml').decode('utf-8')
                      version = re.search(r'^version:\s*(\S+)\s*$', spec, re.M)
                      actual_version = version.group(1) if version else '(missing)'
                      if actual_version != expected_version:
                          print('Skipping', path.name, '- expected project version',
                                expected_version, 'but found', actual_version)
                          continue
                      valid.append(path)
              except (BadZipFile, UnicodeError, KeyError, OSError) as err:
                  print('Skipping', path.name, '-', err)
          if not valid:
              raise SystemExit('ERROR: ZIP files exist, but none contains the complete '
                               f'Madrasati {expected_version} Flutter project. '
                               'Confirm the source version inside pubspec.yaml.')
          # Never silently select an old archive when multiple different
          # sources advertise the same version. Identical copies are harmless.
          if len(valid) > 1:
              import hashlib
              hashes = {
                  hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in valid
              }
              if len(hashes) > 1:
                  raise SystemExit('ERROR: Multiple DIFFERENT Madrasati ZIPs '
                                   f'with version {expected_version} in repository root. '
                                   'Delete old duplicates and keep only the latest.')
          preferred = [p for p in valid if p.name == expected_archive]
          archive = preferred[0] if preferred else valid[0]
          if target.exists():
              raise SystemExit('ERROR: Build extraction directory already exists.')
          with ZipFile(archive) as source:
              members = source.infolist()
              names = [item.filename for item in members]
              if len(set(names)) != len(names):
                  raise SystemExit('ERROR: Duplicate names in source ZIP.')
              if len(names) > 6000 or sum(i.file_size for i in members) > 150_000_000:
                  raise SystemExit('ERROR: Unexpectedly large project ZIP.')
              for item in members:
                  path = PurePosixPath(item.filename)
                  if (path.is_absolute() or '..' in path.parts
                      or chr(92) in item.filename
                      or stat.S_ISLNK(item.external_attr >> 16)):
                      raise SystemExit('ERROR: Unsafe file path in ZIP: ' + item.filename)
              if source.testzip() is not None:
                  raise SystemExit('ERROR: ZIP file is damaged.')
              source.extractall(target)
          if '\n' in archive.name or '\r' in archive.name:
              raise SystemExit('ERROR: Invalid archive filename.')
          with env_file.open('a', encoding='utf-8') as out:
              out.write(f'PROJECT_ARCHIVE={archive}\n')
          print('Selected project ZIP:', archive.name)
          print('Extracted complete Flutter source to:', target)
          PY
          cd "$PROJECT_DIR"
          python3 ci/check_source.py
          python3 ci/check_dart_syntax_shape.py
          python3 ci/unified_regression_audit.py

      - name: Configure Maven Central mirror in extracted source (HTTP 429 protection)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PYMIRROR'
          from pathlib import Path

          mirror = 'https://maven-central-eu.storage-download.googleapis.com/maven2/'
          files = {
              'android/settings.gradle': (
                  '        google()\n        mavenCentral()\n        gradlePluginPortal()',
                  '        maven { url = uri("' + mirror + '") }\n'
                  '        google()\n        mavenCentral()\n        gradlePluginPortal()'),
              'android/build.gradle': (
                  '        google()\n        mavenCentral()',
                  '        maven { url = uri("' + mirror + '") }\n'
                  '        google()\n        mavenCentral()'),
          }
          for filename, (old, new) in files.items():
              path = Path(filename)
              content = path.read_text(encoding='utf-8')
              if mirror not in content:
                  if content.count(old) != 1:
                      raise SystemExit('ERROR: Cannot safely configure Maven mirror in ' + filename)
                  path.write_text(content.replace(old, new, 1), encoding='utf-8')
              if content.count('mavenCentral()') != 1:
                  raise SystemExit('ERROR: Unexpected Maven Central repository configuration in ' + filename)
              updated = path.read_text(encoding='utf-8')
              assert updated.index(mirror) < updated.index('mavenCentral()'), filename
              print('Maven mirror configured before Central in', filename)
          PYMIRROR

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ZIP-only repository: there are NO Gradle build files in GITHUB_WORKSPACE.
      # setup-gradle@v6 with basic caching hashes **/*.gradle* at the repository
      # root and fails before Gradle starts. Cache by ZIP bytes instead.
      # The already-extracted Gradle project is under RUNNER_TEMP, not the repository.
      - name: Cache extracted project's Gradle downloads (ZIP-safe)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-madrasati-gradle-zip-v2-${{ hashFiles('*.zip') }}
          restore-keys: |
            ${{ runner.os }}-madrasati-gradle-zip-v2-

      - name: Install and verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory is missing after Android setup."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager is missing from PATH and $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$SDK_ROOT" "$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          test -s "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "$NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Resolve the unified dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get
          flutter pub deps --style=compact

      - name: Compile-check root Flutter source and widget tests before running them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos lib test 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/analyze-root-early.log"

      - name: Verify approved premium Flutter homepage and navigation FIRST
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          cd "$PROJECT_DIR"
          flutter test --no-pub --reporter expanded \
            test/mosaic_home_test.dart \
            test/navigation_palette_test.dart \
            test/modern_preview_test.dart \
            test/unified_design_test.dart test/unified_no_legacy_navigation_test.dart \
            test/day_cards_test.dart \
            test/school_statistics_grid_test.dart \
            2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/approved-ui-tests.log"

      - name: Verify administrator PIN recovery and security guards FIRST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          cd "$PROJECT_DIR"
          flutter test --no-pub --reporter expanded test/security_store_test.dart test/app_lock_gate_test.dart 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/admin-pin-tests.log"

      - name: Verify Sajli student dialogs and grade restoration FIRST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          cd "$PROJECT_DIR/modules/sajli"
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/sajli-pub-get.log"
          # These three cases failed in build #32. Test the real navigation,
          # grade persistence, nested app shell, and delete/undo behaviour.
          flutter test --reporter expanded test/student_name_navigation_test.dart test/student_picker_grid_test.dart test/parent_report_layout_test.dart test/design_test.dart test/attendance_link_test.dart \
            2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/sajli-profile-regression.log"

      - name: Verify GitHub manager authorization and library catalog FIRST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          cd "$PROJECT_DIR/modules/library"
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/library-pub-get.log"
          flutter test --reporter expanded \
            test/github_manager_verifier_test.dart \
            test/github_manager_storage_test.dart \
            test/catalog_test.dart \
            test/reading_position_test.dart \
            test/catalog_merge_test.dart \
            2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/library-manager-access.log"

      - name: Check Android Gradle configuration before long tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PYCODE'
          import os
          import shutil
          from pathlib import Path
          flutter = Path(shutil.which('flutter')).resolve().parent.parent
          sdk = Path(os.environ['ANDROID_HOME']).resolve()
          Path('android/local.properties').write_text(
              f'sdk.dir={sdk}\nflutter.sdk={flutter}\n', encoding='utf-8')
          PYCODE
          cd android
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs"
          ./gradlew --no-daemon --version
          # Do not enumerate every task here: avoid unnecessary Maven requests.
          # AGP 9 registers unit tests for the tested (normally debug) variant.
          # A dry-run verifies task existence and the dependency graph without running tests.
          ./gradlew --no-daemon :app:testDebugUnitTest --dry-run --stacktrace 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/android-test-dry-run.log"

      - name: Analyze Flutter feature modules after dependency setup
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos modules/jadwali/lib modules/bell/lib modules/sajli/lib modules/scanner/lib modules/library/lib modules/card_settings/lib 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/analyze-modules.log"

      - name: Build ABI-specific APKs and verify signing mode (release or clearly labelled QA)
        env:
          MADRASATI_KEYSTORE_B64: ${{ secrets.MADRASATI_KEYSTORE_B64 }}
          MADRASATI_STORE_PASSWORD: ${{ secrets.MADRASATI_STORE_PASSWORD }}
          MADRASATI_KEY_ALIAS: ${{ secrets.MADRASATI_KEY_ALIAS }}
          MADRASATI_KEY_PASSWORD: ${{ secrets.MADRASATI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$RUNNER_TEMP/madrasati-ci-logs" "$RUNNER_TEMP/deliverables"
          if [[ -n "$LIBRARY_OWNER" && -z "$LIBRARY_REPO" ]] || [[ -z "$LIBRARY_OWNER" && -n "$LIBRARY_REPO" ]]; then
            echo 'Set both LIBRARY_OWNER and LIBRARY_REPO, or leave both empty to use the bundled catalog.'
            exit 1
          fi
          if [[ -n "${MADRASATI_KEYSTORE_B64}${MADRASATI_STORE_PASSWORD}${MADRASATI_KEY_ALIAS}${MADRASATI_KEY_PASSWORD}" ]]; then
            : "${MADRASATI_KEYSTORE_B64:?Missing release keystore}" "${MADRASATI_STORE_PASSWORD:?Missing store password}" "${MADRASATI_KEY_ALIAS:?Missing key alias}" "${MADRASATI_KEY_PASSWORD:?Missing key password}"
            export MADRASATI_RELEASE_STORE="$RUNNER_TEMP/madrasati-release.keystore"
            umask 077
            trap 'rm -f "$MADRASATI_RELEASE_STORE"' EXIT
            printf '%s' "$MADRASATI_KEYSTORE_B64" | base64 --decode > "$MADRASATI_RELEASE_STORE"
            unset MADRASATI_KEYSTORE_B64
            echo 'Building ABI-specific RELEASE APKs signed with the configured stable keystore.'
            flutter build apk --release --split-per-abi --no-pub \
              --dart-define="LIBRARY_OWNER=$LIBRARY_OWNER" \
              --dart-define="LIBRARY_REPO=$LIBRARY_REPO" \
              --dart-define="LIBRARY_BRANCH=$LIBRARY_BRANCH" 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/apk-build.log"
            BUILD_KIND='release'
            APK_VARIANT='release'
          else
            echo '::warning::No stable release keystore configured. Building ABI-specific DEBUG QA APKs only. These are NOT releases and signatures may change on another runner.'
            flutter build apk --debug --split-per-abi --no-pub \
              --dart-define="LIBRARY_OWNER=$LIBRARY_OWNER" \
              --dart-define="LIBRARY_REPO=$LIBRARY_REPO" \
              --dart-define="LIBRARY_BRANCH=$LIBRARY_BRANCH" 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/apk-build.log"
            BUILD_KIND='debug-test'
            APK_VARIANT='debug'
          fi

          shopt -s nullglob
          APK_FILES=(build/app/outputs/flutter-apk/app-*-${APK_VARIANT}.apk)
          if [[ ${#APK_FILES[@]} -ne 3 ]]; then
            printf 'Expected exactly 3 ABI APKs, found %s. Files: %s\n' "${#APK_FILES[@]}" "${APK_FILES[*]:-none}"
            exit 1
          fi
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APK_SIGNER="$BUILD_TOOLS_DIR/apksigner"
          for tool in "$AAPT" "$AAPT2" "$APK_SIGNER"; do
            if [[ ! -x "$tool" ]]; then
              echo "::error::Required Android build tool is missing or not executable: $tool"
              ls -lah "$BUILD_TOOLS_DIR" || true
              exit 1
            fi
          done
          : > "$RUNNER_TEMP/madrasati-apk-size-report.txt"
          for apk in "${APK_FILES[@]}"; do
            basename="$(basename "$apk")"
            abi="${basename#app-}"
            abi="${abi%-${APK_VARIANT}.apk}"
            info="$RUNNER_TEMP/madrasati-ci-logs/madrasati-apk-info-${abi}.txt"
            info_error="$RUNNER_TEMP/madrasati-ci-logs/madrasati-apk-info-${abi}.err"
            signing="$RUNNER_TEMP/madrasati-ci-logs/madrasati-signing-${abi}.txt"
            signing_error="$RUNNER_TEMP/madrasati-ci-logs/madrasati-signing-${abi}.err"

            echo "Checking APK archive integrity: $basename"
            if [[ ! -s "$apk" ]] || ! unzip -tq "$apk"; then
              echo "::error::APK is missing, empty, or has invalid ZIP contents: $apk"
              exit 1
            fi

            echo "Reading APK manifest metadata for ABI: $abi"
            if ! "$AAPT" dump badging "$apk" > "$info" 2> "$info_error"; then
              echo "aapt failed; retrying with aapt2. Original diagnostic:"
              cat "$info_error" || true
              if ! "$AAPT2" dump badging "$apk" > "$info" 2> "$info_error"; then
                echo "::error::Both aapt and aapt2 failed to read APK metadata for $abi."
                cat "$info_error" || true
                exit 1
              fi
            fi

            echo "Verifying APK signature for ABI: $abi"
            if ! "$APK_SIGNER" verify --verbose --print-certs "$apk" > "$signing" 2> "$signing_error"; then
              echo "::error::APK signature verification failed for $abi."
              cat "$signing_error" || true
              cat "$signing" || true
              exit 1
            fi

            echo "Validating package ID and version for ABI: $abi"
            python3 - "$info" "$abi" "$EXPECTED_PROJECT_VERSION" <<'PYAPK'
          from pathlib import Path
          import re
          import sys

          info = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          abi = sys.argv[2]
          project_version = sys.argv[3]
          package_lines = [line for line in info.splitlines() if line.startswith('package:')]
          print('APK package metadata:', package_lines[0] if package_lines else '(no package metadata line)')
          if not package_lines:
              raise SystemExit(f'ERROR: aapt output contains no package metadata for {abi}. Full output follows:\n{info}')

          try:
              base_version_code = int(project_version.rsplit('+', 1)[1])
          except (IndexError, ValueError):
              raise SystemExit(f'ERROR: invalid expected project version: {project_version!r}')

          # Flutter adds a per-ABI offset for ABI-split APKs.
          abi_version_offsets = {
              'armeabi-v7a': 1000,
              'arm64-v8a': 2000,
              'x86_64': 4000,
          }
          if abi not in abi_version_offsets:
              raise SystemExit(f'ERROR: unexpected APK ABI {abi!r}; cannot validate its versionCode.')
          expected_abi_version_code = str(base_version_code + abi_version_offsets[abi])

          line = package_lines[0]
          checks = {
              'applicationId': (r"\bname='([^']+)'", 'iq.madrasati.school'),
              'versionCode': (r"\bversionCode='([^']+)'", expected_abi_version_code),
              'versionName': (r"\bversionName='([^']+)'", project_version.split('+', 1)[0]),
          }
          print(f'Expected {abi} versionCode: {expected_abi_version_code} (base {base_version_code} + ABI offset {abi_version_offsets[abi]}).')
          for label, (pattern, expected) in checks.items():
              match = re.search(pattern, line)
              actual = match.group(1) if match else '(missing)'
              if actual != expected:
                  raise SystemExit(f'ERROR: {abi} APK {label} mismatch: expected {expected!r}, found {actual!r}.')
          PYAPK
            cp "$apk" "$RUNNER_TEMP/deliverables/Madrasati-v1.4.5-${abi}-${BUILD_KIND}.apk"
            cp "$info" "$RUNNER_TEMP/deliverables/"
            cp "$signing" "$RUNNER_TEMP/deliverables/"
            bytes="$(stat -c '%s' "$apk")"
            printf '%s  %s bytes\n' "$abi" "$bytes" | tee -a "$RUNNER_TEMP/madrasati-apk-size-report.txt"
          done
          cp "$RUNNER_TEMP/madrasati-apk-size-report.txt" "$RUNNER_TEMP/deliverables/"
          printf 'Signing mode: %s\nOutput: three architecture-specific APKs (arm64-v8a, armeabi-v7a, x86_64).\n' "$BUILD_KIND" > "$RUNNER_TEMP/madrasati-build-kind.txt"
          cp "$RUNNER_TEMP/madrasati-build-kind.txt" "$RUNNER_TEMP/deliverables/"

      - name: Run Android bell regression tests (AGP 9 debug variant)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/android-tests.log"
          # Requiring the JUnit XML results avoids a false green from an empty/dummy task.
          cd "$PROJECT_DIR"
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree

          folder = Path('build/app/test-results/testDebugUnitTest')
          reports = list(folder.rglob('TEST-*.xml'))
          if not reports:
              raise SystemExit('ERROR: Android unit-test task returned without any JUnit XML reports.')
          tests = errors = failures = skipped = 0
          suites = set()
          for report in reports:
              xml = ElementTree.parse(report).getroot()
              suites.add(xml.get('name', ''))
              tests += int(xml.get('tests', 0))
              errors += int(xml.get('errors', 0))
              failures += int(xml.get('failures', 0))
              skipped += int(xml.get('skipped', 0))
          print(f'Android JUnit: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped')
          expected = {'com.school.teacherbell.BellSchedulerTest',
                      'com.school.teacherbell.BellVibrationTest'}
          if tests < 15 or errors or failures or skipped or not expected.issubset(suites):
              raise SystemExit('ERROR: The Android regression suite did not fully pass.')
          PYTEST

      - name: Test shared school workflows
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/shared-tests.log"

      - name: Test original scheduling, reports, scanner and notification logic
        shell: bash
        run: |
          set -euo pipefail
          for module in jadwali sajli scanner library bell; do
            (
              cd "$PROJECT_DIR/modules/$module"
              if [[ -d test ]]; then flutter test 2>&1 | tee "$RUNNER_TEMP/madrasati-ci-logs/$module-tests.log"; fi
            )
          done

      - name: Prepare verified source and dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deliverables"
          cp "$PROJECT_ARCHIVE" "$RUNNER_TEMP/deliverables/madrasati-flutter-v1.4.5.zip"
          cp "$PROJECT_DIR/pubspec.lock" "$RUNNER_TEMP/deliverables/resolved-pubspec.lock"

      - name: Diagnose Maven Central HTTP 429 (only on failure)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if grep -r -E -q 'status code 429|Too Many Requests' "$RUNNER_TEMP/madrasati-ci-logs" 2>/dev/null; then
            echo '::error::Maven returned HTTP 429, a remote rate limit. Maven mirror and Gradle cache are enabled. This is not a Dart or Kotlin compilation error.'
          fi

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-v1.4.5-failure-logs
          path: ${{ runner.temp }}/madrasati-ci-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: madrasati-v1.4.5-android
          path: ${{ runner.temp }}/deliverables/
          if-no-files-found: error
